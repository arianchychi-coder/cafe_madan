
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 8px;
            color: #1e293b;
            font-size: 28px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            background: #fff;
            color: #1e293b;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">
        <h2>Register</h2>
        <p class="subtitle">Create your account</p>

        <form id="loginform">

            <div class="form-group">
                <label for="name">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your Username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your Ppassword"
                    required
                >
            </div>


            <button type="submit" id="login">login</button>

        </form>
    </div>


<script src="./js/adminlogin.js"></script>

</body>
</html>
